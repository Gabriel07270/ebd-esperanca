 mal contra mim, porém Deus o intentou para bem.",keyword:"perdão",char:"José",theme:"que perdoar liberta e Deus transforma mal em bem",emotion:"emoção e choro de reconciliação",prop:"anel do Egito e pão"},{week:8,title:"Moisés Nasce",ref:"Êxodo 2",verse:"Êxodo 2:10",verseText:"E crescendo o menino, ela o trouxe à filha de Faraó.",keyword:"cesto",char:"Moisés bebê",theme:"que Deus protege e tem propósito desde o berço",emotion:"tensão e cuidado",prop:"cesto de palha e rio de tecido azul"},{week:9,title:"Mar Vermelho",ref:"Êxodo 14",verse:"Êxodo 14:21",verseText:"Então Moisés estendeu a sua mão sobre o mar.",keyword:"mar",char:"Moisés",theme:"que Deus abre caminho onde não há caminho",emotion:"medo virando vitória",prop:"lençol azul gigante e cajado"},{week:10,title:"10 Mandamentos",ref:"Êxodo 20",verse:"Êxodo 20:3",verseText:"Não terás outros deuses diante de mim.",keyword:"lei",char:"Moisés",theme:"que Deus nos dá regras por amor para vivermos bem",emotion:"solenidade e respeito",prop:"duas tábuas de papelão"},{week:11,title:"Muralhas de Jericó",ref:"Josué 6",verse:"Josué 6:20",verseText:"Gritou, pois, o povo, tocando os sacerdotes as buzinas.",keyword:"muralha",char:"Josué",theme:"que obediência e louvor derrubam muralhas",emotion:"marcha e grito de guerra",prop:"trombetas de papel e copos para muro"},{week:12,title:"Rute",ref:"Rute 1-4",verse:"Rute 1:16",verseText:"Disse porém Rute: Não me instes para que te abandone.",keyword:"lealdade",char:"Rute",theme:"que lealdade e bondade são recompensadas por Deus",emotion:"doçura e fidelidade",prop:"espigas de trigo e manto"},{week:13,title:"Davi e Golias",ref:"1 Samuel 17",verse:"1 Samuel 17:45",verseText:"Davi disse ao filisteu: Tu vens a mim com espada, eu vou em nome do Senhor.",keyword:"gigante",char:"Davi",theme:"que Deus usa pequenos para vencer gigantes",emotion:"coragem contra medo",prop:"funda e 5 pedras lisas"},{week:14,title:"Davi e Mefibosete",ref:"2 Samuel 9",verse:"2 Samuel 9:7",verseText:"Não temas, porque decerto usarei contigo de benevolência.",keyword:"graça",char:"Mefibosete",theme:"que a graça nos convida para a mesa do Rei",emotion:"graça e inclusão",prop:"mesa de rei e muletas"},{week:15,title:"Salomão e Sabedoria",ref:"1 Reis 3",verse:"1 Reis 3:9",verseText:"Dá, pois, ao teu servo um coração entendido.",keyword:"sabedoria",char:"Salomão",theme:"que pedir sabedoria agrada a Deus mais que riquezas",emotion:"sabedoria serena",prop:"coroa e balão do desejo"},{week:16,title:"Elias e Baal",ref:"1 Reis 18",verse:"1 Reis 18:39",verseText:"O que vendo todo o povo, caiu sobre os seus rostos e disse: Só o Senhor é Deus!",keyword:"fogo",char:"Elias",theme:"que só o Senhor é Deus verdadeiro e responde com fogo",emotion:"confronto e fogo",prop:"altar de pedras e fogo vermelho de celofane"},{week:17,title:"Ester Salva",ref:"Ester 4-5",verse:"Ester 4:14",verseText:"E quem sabe se para tal tempo como este chegaste a este reino?",keyword:"coragem",char:"Ester",theme:"que Deus nos coloca em lugares estratégicos para salvar",emotion:"coragem real",prop:"coroa dourada e cetro"},{week:18,title:"Daniel na Cova",ref:"Daniel 6",verse:"Daniel 6:22",verseText:"O meu Deus enviou o seu anjo, e fechou a boca dos leões.",keyword:"leões",char:"Daniel",theme:"que Deus fecha boca de leões quando somos fiéis na oração",emotion:"quietude e livramento",prop:"leões de pelúcia e pedra"},{week:19,title:"Jonas",ref:"Jonas 1-4",verse:"Jonas 2:9",verseText:"Os que observam as vaidades vãs deixam a sua misericórdia.",keyword:"peixe",char:"Jonas",theme:"que Deus é misericordioso e dá segunda chance",emotion:"fuga e misericórdia",prop:"peixe grande de TNT"},{week:20,title:"Nascimento de Jesus",ref:"Lucas 2",verse:"Lucas 2:11",verseText:"Pois, na cidade de Davi, vos nasceu hoje o Salvador, que é Cristo.",keyword:"manjedoura",char:"Jesus bebê",theme:"que Jesus veio humilde para ser nosso Salvador",emotion:"encanto e humildade",prop:"manjedoura e panos"},{week:21,title:"Jesus no Templo",ref:"Lucas 2:41-52"
